<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- cabworkdesign.com is closed behind a password (owner, 2026-11-27; Cabwork is now Kick & Crown, at
       kickandcrown.app). This page is the gate (gate.js); behind it is store/. The landing page it
       replaced is in this repo's history (main at a17ebf2). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Private</title>
  <meta name="theme-color" content="#161618">
  <style>
    html { background: #161618; color: #e9e6df; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.4 system-ui, sans-serif; }
    form { display: grid; gap: 10px; width: min(280px, 80vw); }
    input, button { font: inherit; padding: 10px 12px; border-radius: 6px; border: 1px solid #45433f; background: #1e1e21; color: inherit; }
    button { background: #d93c3c; border-color: #d93c3c; color: #fff; font-weight: 600; cursor: pointer; }
    p { margin: 0; font-size: 14px; color: #ff8a8a; }
  </style>
  <script src="gate.js" data-form></script>
</head>
<body>
  <form id="gate">
    <input id="gate-pw" type="password" aria-label="Password" placeholder="Password" autocomplete="current-password" autofocus>
    <button type="submit">Unlock</button>
    <p id="gate-err" hidden>Wrong password</p>
  </form>
</body>
</html>
